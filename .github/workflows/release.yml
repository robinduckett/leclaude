# The release workflow. A tag with the form "v*" starts it.
#
# The workflow compiles both architectures, packages the zip files, and
# publishes a GitHub release. It attests the build provenance with Sigstore.
# A user can then make sure that a zip file comes from this repository:
#
#   gh attestation verify Leclaude-<tag>-x64.zip --owner robinduckett

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - preset: x64-release
            arch: x64
            name: x64
          - preset: arm64-release
            arch: x64_arm64
            name: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Compile
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        if: matrix.arch == 'x64'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $stage = 'stage/Leclaude'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build/${{ matrix.preset }}/LeclaudeShell.dll" $stage
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 $stage
          Copy-Item scripts/install.cmd, scripts/uninstall.cmd $stage
          Copy-Item LICENSE, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "Leclaude-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Make the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $version = '${{ github.ref_name }}'.TrimStart('v')
          iscc /Q "/DAppVersion=$version" /DArch=${{ matrix.name }} installer/leclaude.iss
          Move-Item installer/output/*.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            Leclaude-*.zip
            LeclaudeSetup-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Make the checksum file
        run: sha256sum Leclaude-*.zip LeclaudeSetup-*.exe > SHA256SUMS.txt

      # The attestation records which workflow made each file. Sigstore signs the record.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Leclaude-*.zip
            LeclaudeSetup-*.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Leclaude-*.zip
            LeclaudeSetup-*.exe
            SHA256SUMS.txt
          body: |
            Leclaude shows a robot badge in Explorer on each folder that has Claude Code session history.

            ## Installation

            1. Download the setup program for your processor: `LeclaudeSetup-<version>-x64.exe` or `LeclaudeSetup-<version>-arm64.exe`.
            2. Start it and give permission. The installer registers the handler and restarts Explorer.

            To remove Leclaude, use "Installed apps" in the Windows settings.

            Windows SmartScreen can show a warning, because the files have no signature.
            If Windows shows the warning, select "More info", then "Run anyway".
            To make sure that a file is authentic, enter: `gh attestation verify <file> --owner robinduckett`

            The zip file is the manual alternative. Unpack it and do a double click on `install.cmd`.
