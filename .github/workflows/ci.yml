# The CI workflow. It compiles both architectures and does the tests on x64.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - preset: x64-release
            arch: x64
            name: x64
          - preset: arm64-release
            arch: x64_arm64
            name: arm64
    steps:
      - uses: actions/checkout@v4

      # This action prepares the MSVC environment, as a developer shell does.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Compile
        run: cmake --build --preset ${{ matrix.preset }}

      # The ARM64 programs cannot operate on the x64 build machine.
      - name: Test
        if: matrix.arch == 'x64'
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

      - name: Make the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          iscc /Q /DAppVersion=0.0.0 /DArch=${{ matrix.name }} installer/leclaude.iss

      # WiX stays on version 5. The later versions need the OSMF license agreement.
      - name: Make the MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix build installer/wix/Leclaude.wxs -arch ${{ matrix.name }} -ext WixToolset.Util.wixext `
            -d AppVersion=0.0.0 -d DllPath=build/${{ matrix.preset }}/LeclaudeShell.dll `
            -o installer/output/Leclaude-0.0.0-${{ matrix.name }}.msi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            installer/output/*.exe
            installer/output/*.msi
